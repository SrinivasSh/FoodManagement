spring.application.name=ConfigServer

server.port=8888

#Properties for for fetching congig properties from GitHub
spring.cloud.config.server.git.uri=https://github.com/SrinivasSh/ConfigProps
spring.cloud.config.server.git.clone-on-start=true
spring.cloud.config.server.git.default-label=develop


#eureka discovery client configuration
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/


